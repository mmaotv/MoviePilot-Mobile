<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MoviePilot Android · 界面预览</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --ink: #2b2733;
    --ink-2: #6f7280;
    --line: #e7e5ef;
    --page: #f7f6fb;
    --brand: #8d51f9;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    background:
      radial-gradient(1100px 620px at 50% -220px, rgba(141, 81, 249, .16), transparent 70%),
      linear-gradient(180deg, #faf9ff 0%, #f4f3fa 60%, #eeeaf8 100%);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    padding: 56px 40px 64px;
  }

  /* ── 页头 ─────────────────────────────────────────── */
  .head { text-align: center; margin-bottom: 46px; }
  .head .mark {
    width: 58px; height: 58px; display: block; margin: 0 auto 16px;
    filter: drop-shadow(0 10px 20px rgba(141, 81, 249, .28));
  }
  .head h1 {
    font-size: 30px; font-weight: 700; letter-spacing: .4px;
    background: linear-gradient(90deg, #3a3541 0%, #6d3fc4 60%, #8d51f9 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .head p { margin-top: 10px; font-size: 14px; color: var(--ink-2); letter-spacing: .3px; }
  .tags { display: flex; gap: 8px; justify-content: center; margin-top: 18px; flex-wrap: wrap; }
  .tag {
    font-size: 11px; letter-spacing: .4px; color: #6d3fc4;
    background: rgba(141, 81, 249, .08);
    border: 1px solid rgba(141, 81, 249, .16);
    padding: 5px 11px; border-radius: 999px;
  }

  /* ── 手机外框 ─────────────────────────────────────── */
  .rail { display: flex; gap: 34px; justify-content: center; align-items: flex-start; flex-wrap: wrap; }
  .device { width: 408px; }
  .frame {
    width: 390px; height: 844px; box-sizing: content-box; border-radius: 42px; padding: 9px;
    background: linear-gradient(160deg, #35313e 0%, #15131a 55%, #2a2633 100%);
    box-shadow:
      0 30px 70px -18px rgba(40, 24, 80, .38),
      0 10px 24px -10px rgba(40, 24, 80, .22),
      inset 0 0 0 1.5px rgba(255, 255, 255, .12);
    position: relative;
  }
  .frame::after { /* 侧键 */
    content: ""; position: absolute; right: -2px; top: 210px; width: 2px; height: 74px;
    border-radius: 2px; background: #4a4553;
  }
  .screen {
    width: 390px; height: 844px; border-radius: 34px; overflow: hidden;
    position: relative; isolation: isolate;
  }
  .cap { margin-top: 16px; text-align: center; font-size: 12.5px; color: var(--ink-2); letter-spacing: .4px; }
  .cap b { color: #5c3d99; font-weight: 600; }

  /* ── 主题变量 ─────────────────────────────────────── */
  .screen[data-theme="light"] {
    --bg: #f4f5fa; --bg-alt: #ede9fb; --surface: #ffffff; --sv: #f0f2f8;
    --outline: #e3e5ee; --primary: #8d51f9; --primary-soft: #f2ebfe;
    --text: #3a3541; --text2: #8a8d93; --danger: #ff4c51; --danger-soft: #ffeff0;
    --scrim: rgba(0, 0, 0, .26); --card-shadow: 0 14px 30px -8px rgba(141, 81, 249, .30);
    --sb-fg: #3a3541;
  }
  .screen[data-theme="dark"] {
    --bg: #0e1116; --bg-alt: #161129; --surface: #161b22; --sv: #21262d;
    --outline: #30363d; --primary: #8d51f9; --primary-soft: #241c3a;
    --text: #e6edf3; --text2: #8b949e; --danger: #ff6b6e; --danger-soft: #2d1416;
    --scrim: rgba(0, 0, 0, .60); --card-shadow: none;
    --sb-fg: #e6edf3;
  }
  /* 截图时去掉圆角，输出矩形整屏 */
  .screen.flat { border-radius: 0 !important; }
  .screen::-webkit-scrollbar, .screen *::-webkit-scrollbar { display: none; }
  .screen { scrollbar-width: none; }

  /* ── 状态栏 ───────────────────────────────────────── */
  .statusbar {
    height: 46px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 22px 0 26px; color: var(--sb-fg); position: relative; z-index: 4;
  }
  .statusbar .t { font-size: 14px; font-weight: 600; letter-spacing: .2px; }
  .statusbar .r { display: flex; align-items: center; gap: 6px; }
  .statusbar svg { display: block; }

  /* ── 登录页 ───────────────────────────────────────── */
  .login { background: var(--bg); }
  .login::before {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, var(--bg) 0%, var(--bg) 55%, var(--bg-alt) 100%);
  }
  .login .glow {
    position: absolute; left: 50%; top: -140px; width: 560px; height: 460px;
    transform: translateX(-50%);
    background: radial-gradient(circle, rgba(141, 81, 249, .16) 0%, rgba(141, 81, 249, 0) 62%);
    pointer-events: none;
  }
  .login-body {
    position: relative; z-index: 2; padding: 34px 24px 0;
    display: flex; flex-direction: column; align-items: center;
  }
  .logo { width: 96px; height: 96px; object-fit: contain; }
  .brand { margin-top: 14px; font-size: 26px; font-weight: 700; letter-spacing: .5px; color: var(--text); }
  .slogan { margin-top: 6px; font-size: 13px; letter-spacing: .3px; color: var(--text2); }

  .card {
    margin-top: 26px; width: 100%; background: var(--surface);
    border: 1px solid var(--outline); border-radius: 18px;
    box-shadow: var(--card-shadow); overflow: hidden;
  }
  .row { display: flex; align-items: center; height: 56px; padding: 0 16px; }
  .row .ico { width: 20px; height: 20px; flex: 0 0 20px; color: var(--text2); }
  .row.filled .ico { color: var(--primary); }
  .row .val { margin-left: 12px; font-size: 15px; color: var(--text); flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .row .trail { color: var(--text2); display: flex; align-items: center; gap: 2px; }
  .hr { height: 1px; background: var(--outline); opacity: .9; }

  .accounts { padding: 11px 16px; }
  .acc-label { font-size: 11px; letter-spacing: .5px; color: var(--text2); }
  .chips { display: flex; gap: 8px; margin-top: 9px; }
  .chip {
    display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px;
    border-radius: 9px; border: 1px solid var(--outline); background: var(--sv);
    font-size: 13px; color: var(--text);
  }
  .chip i {
    width: 18px; height: 18px; border-radius: 5px; background: var(--outline);
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 10px; font-style: normal; color: var(--text2);
  }
  .chip.on { background: var(--primary-soft); border-color: rgba(141, 81, 249, .45); color: var(--primary); }
  .chip.on i { background: var(--primary); color: #fff; }

  .remember { display: flex; align-items: center; gap: 4px; padding: 7px 16px 7px 12px; }
  .cbx {
    width: 22px; height: 22px; border-radius: 6px; background: var(--primary);
    display: flex; align-items: center; justify-content: center; flex: 0 0 22px;
  }
  .remember span { font-size: 13px; color: var(--text); margin-left: 4px; }

  .btn-login {
    margin-top: 20px; width: 100%; height: 52px; border: 0; border-radius: 14px;
    background: linear-gradient(90deg, #8d51f9 0%, #a478ff 100%);
    color: #fff; font-size: 16px; font-weight: 600; letter-spacing: 4px; text-indent: 4px;
    font-family: inherit;
    box-shadow: 0 14px 26px -8px rgba(141, 81, 249, .55);
  }
  .screen[data-theme="dark"] .btn-login { box-shadow: none; }
  .ver { margin-top: 22px; font-size: 11px; color: var(--text2); opacity: .75; }

  /* ── PWA 屏 ───────────────────────────────────────── */
  .pwa { background: #0b1322; }
  .pwa .shot {
    position: absolute; left: 0; top: 46px; width: 100%; height: calc(100% - 46px);
    object-fit: cover; object-position: top center; display: block;
  }
  .pwa .statusbar {
    position: absolute; top: 0; left: 0; right: 0; z-index: 7; color: #fff;
    background: linear-gradient(180deg, rgba(9, 16, 28, .55), rgba(9, 16, 28, 0));
  }
  .fab {
    position: absolute; width: 48px; height: 48px; border-radius: 50%;
    right: 22px; bottom: 168px; background: rgba(141, 81, 249, .92);
    box-shadow: 0 6px 16px rgba(0, 0, 0, .4);
    display: flex; align-items: center; justify-content: center; z-index: 3;
  }
  .fab svg { color: #fff; }
  .scrim { position: absolute; inset: 0; background: var(--scrim); z-index: 5; }
  .sheet {
    position: absolute; left: 0; right: 0; bottom: 0; height: 74%;
    background: var(--surface); border-radius: 20px 20px 0 0; z-index: 6;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .handle { width: 36px; height: 4px; border-radius: 2px; background: var(--outline); margin: 8px auto 0; }
  .sheet-head { display: flex; align-items: center; padding: 12px 8px 8px 20px; }
  .sheet-head .t1 { font-size: 17px; font-weight: 500; color: var(--text); }
  .sheet-head .t2 { font-size: 11px; color: var(--text2); margin-top: 2px; }
  .sheet-head .x { margin-left: auto; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; color: var(--text2); }

  .sec { display: flex; align-items: center; padding: 14px 8px 2px 20px; }
  .sec .st { font-size: 11px; letter-spacing: 1px; color: var(--text2); flex: 1; }
  .sec .act { display: flex; align-items: center; gap: 2px; color: var(--primary); font-size: 12px; padding: 6px 10px; }

  .addr { padding: 6px 20px 0; }
  .addr-row { display: flex; align-items: center; gap: 8px; }
  .pfield {
    flex: 1; height: 40px; border-radius: 9px; background: var(--sv);
    border: 1px solid var(--outline); display: flex; align-items: center;
    padding: 0 12px; font-size: 12px; color: var(--text2);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .connect { height: 40px; padding: 0 16px; border-radius: 9px; background: var(--sv); color: var(--text2); font-size: 13px; display: flex; align-items: center; }
  .connect.on { background: var(--primary); color: #fff; }
  .addr-tip { font-size: 10px; color: var(--text2); margin-top: 6px; }

  .saved-label { padding: 10px 20px 2px; font-size: 10px; letter-spacing: 1px; color: var(--text2); }
  .item { display: flex; align-items: center; padding: 10px 4px 10px 20px; }
  .item .nm { font-size: 14px; color: var(--text); }
  .item .nm.on { color: var(--primary); }
  .item .url { font-size: 11px; color: var(--text2); margin-top: 1px; }
  .item .grow { flex: 1; overflow: hidden; }
  .badge { font-size: 10px; color: var(--primary); background: rgba(141, 81, 249, .14); padding: 2px 6px; border-radius: 5px; }
  .del { width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; color: var(--text2); opacity: .55; }

  .acct { display: flex; align-items: center; padding: 8px 4px 8px 20px; }
  .ava {
    width: 32px; height: 32px; border-radius: 9px; background: var(--sv);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 500; color: var(--text2); flex: 0 0 32px;
  }
  .ava.on { background: rgba(141, 81, 249, .2); color: var(--primary); }
  .acct .nm { font-size: 14px; color: var(--text); }
  .acct .nm.on { color: var(--primary); }
  .acct .sub { font-size: 10px; color: var(--text2); margin-top: 1px; }

  .sheet-foot {
    margin-top: auto; border-top: 1px solid var(--outline);
    display: flex; align-items: center; padding: 16px 20px 22px;
  }
  .sheet-foot .out { font-size: 14px; color: var(--danger); flex: 1; }
  .sheet-foot .hint { font-size: 11px; color: var(--text2); }

  .foot { margin-top: 46px; text-align: center; font-size: 11.5px; color: #8b8797; letter-spacing: .3px; }
</style>
</head>
